spring:
  datasource:
    url: jdbc:mysql://localhost:3306/hospital_management_system
    username: root
    password: 123456

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true   # << Add this line

  sql:
    init:
      mode: always           # always, embedded, never
      platform: mysql
      data-locations: classpath:/data.sql
